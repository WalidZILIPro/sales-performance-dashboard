server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same origin for the page and the API: no CORS in production, and the browser only ever talks to nginx.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # The API rate-limits per client IP; without this every user would share nginx's IP and one bucket.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Vite puts a content hash in every asset name, so assets can be cached forever...
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ...while index.html must always be revalidated so a new build is picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
